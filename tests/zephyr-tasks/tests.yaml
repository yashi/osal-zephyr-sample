tests:
  osal.zephyr.tasks.static:
    tags:
      - osal
      - tasks
      - lifecycle
      - static
    harness: ztest
    timeout: 90
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - nucleo_h755zi_q/stm32h755xx/m7
    integration_platforms:
      - native_sim
      - qemu_cortex_m3
      - nucleo_h755zi_q/stm32h755xx/m7
  osal.zephyr.tasks.dynamic:
    tags:
      - osal
      - tasks
      - lifecycle
      - dynamic
    harness: ztest
    timeout: 90
    extra_configs:
      - CONFIG_CFS_OSAL_DYNAMIC_TASK_STACKS=y
      - CONFIG_HEAP_MEM_POOL_SIZE=3072
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - nucleo_h755zi_q/stm32h755xx/m7
    integration_platforms:
      - native_sim
      - qemu_cortex_m3
      - nucleo_h755zi_q/stm32h755xx/m7
